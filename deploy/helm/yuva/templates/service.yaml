apiVersion: v1
kind: Service
metadata:
  name: {{ include "yuva.fullname" . }}
  labels:
    {{- include "yuva.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "yuva.selectorLabels" . | nindent 4 }}
{{- if .Values.service.analytics.separateService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yuva.fullname" . }}-analytics
  labels:
    {{- include "yuva.labels" . | nindent 4 }}
  {{- with .Values.service.analytics.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "yuva.selectorLabels" . | nindent 4 }}
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yuva.fullname" . }}-metrics
  labels:
    {{- include "yuva.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "yuva.selectorLabels" . | nindent 4 }}
{{- end }}
