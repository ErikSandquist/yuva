{{- if and (not .Values.secrets.existingSecret) .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yuva.fullname" . }}
  labels:
    {{- include "yuva.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.secrets.values }}
  {{- if $v }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
