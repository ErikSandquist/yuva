dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

protocols = imap
listen = 127.0.0.1
base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

mail_uid = vmail
mail_gid = vmail
mail_driver = maildir
mail_home = /srv/vmail/%{user | username | lower}
mail_path = ~/Maildir
mailbox_list_utf8 = yes

import_environment {
  USER_PASSWORD = %{env:USER_PASSWORD | default('{CRYPT}*')}
}

auth_allow_cleartext = yes
auth_mechanisms = plain login xoauth2

passdb static {
  mechanisms_filter = plain login
  password = %{env:USER_PASSWORD}
}

passdb oauth2 {
  mechanisms_filter = xoauth2
}

oauth2 {
  introspection_mode = post
  introspection_url = http://127.0.0.1:59980/introspect
  username_attribute = username
  active_attribute = active
  active_value = true
}

ssl = yes
ssl_server {
  cert_file = /etc/dovecot/ssl/tls.crt
  key_file = /etc/dovecot/ssl/tls.key
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
  }
  mailbox Spam {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Drafts {
    special_use = \Drafts
  }
}

protocol imap {
  rawlog_dir = %{home}/rawlog
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 59994
  }
}
